name: Build Phoenix Windows installers and portable ZIPs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/custom-windows-build.yml
  workflow_dispatch:
    inputs:
      target:
        description: Windows variants to build
        required: true
        default: both
        type: choice
        options:
          - both
          - modern
          - legacy

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'modern' && '["modern"]' || inputs.target == 'legacy' && '["legacy"]' || '["modern","legacy"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - name: Install desktop dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Build pinned Phoenix editor
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run _ci-release:dev
      - name: Prepare Windows configuration
        run: node src-build/prepareWindowsBuild.js ${{ matrix.target }}
      - name: Compile portable Windows application
        run: npx tauri build --config src-tauri/tauri-custom.conf.json --bundles none
      - name: Package portable application
        run: node src-build/packagePortableWindows.js ${{ matrix.target }}
      - name: Verify portable package
        shell: pwsh
        run: |
          $dir = "dist/portable/phoenix-windows-${{ matrix.target }}"
          @("phoenix-code-ide.exe", "phnode.exe", "src-node/package.json", "Run Phoenix Portable.cmd", "README-PORTABLE.txt") | ForEach-Object {
            if (!(Test-Path (Join-Path $dir $_))) { throw "Missing portable component: $_" }
          }
          Get-FileHash (Join-Path $dir "phoenix-code-ide.exe") -Algorithm SHA256
      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-windows-${{ matrix.target }}-portable
          path: dist/portable/phoenix-windows-${{ matrix.target }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Build unsigned NSIS installer
        id: nsis
        continue-on-error: true
        run: npx tauri build --config src-tauri/tauri-custom.conf.json
      - name: Upload NSIS installer
        if: steps.nsis.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-windows-${{ matrix.target }}-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
